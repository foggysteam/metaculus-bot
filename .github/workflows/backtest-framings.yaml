name: Backtest framings

# Yes/no forecasts on one question come out nearly identical, since they read the same research, so
# the ensemble adds little. This tests giving each forecast a different approach (outside view,
# inside view, devil's advocate; forecaster.BINARY_FRAMINGS): run vfr1, Opus 5.5 with no fallback,
# 3 forecasts each reading both reports of v1 + v1-r2, against vb2 (the same setup without
# framings). Only the framing changes. Ahmad's go-ahead, 14 Nov 2026, with no need for a cap (the
# first full run started with a $20 one). Runs on the Max plan. Results are committed to main; a
# re-run skips saved questions. Delete this file afterwards.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Questions per run (blank = all; 1 for a smoke test)"
        default: ""

concurrency:
  group: backtest-framings
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      BUDGET_USD: "1000"  # no real cap (Ahmad, 14 Nov 2026); vb2 used $12.64 for the same 76 questions
      LIMIT: ${{ inputs.limit || '1000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
      - name: Install
        run: bash .github/scripts/retry.sh uv sync --locked && bash .github/scripts/install_claude.sh
      - name: Run
        id: run
        run: |
          uv run python backtest/run_backtest.py --run vfr1 --variant framings --forecast-model claude-opus-5-5 \
            --reuse-research v1 --reuse-research-b v1-r2 --predictions 3 --market-predictions 0 --parallel 2 \
            --budget-usd $BUDGET_USD --limit $LIMIT 2>&1 | tee -a run.log || true
      - name: Save results, and score when the run is done
        if: always()
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          count() { find "backtest/results/$1" -maxdepth 1 -name '*.json' 2>/dev/null | wc -l; }
          spent=$(uv run python -c "import sys; sys.path.insert(0, 'backtest'); from budget import saved_cost; print(f'{saved_cost([\"vfr1\"]):.2f}')" 2>/dev/null || echo "?")
          summary="vfr1 $(count vfr1) of 76, notional \$$spent of \$$BUDGET_USD"
          echo "$summary"
          # Only a full run that ended by itself is scored (a cancelled run opened a false notice, #13).
          if [ "$LIMIT" -ge 1000 ] && [ "${{ steps.run.outcome }}" = "success" ]; then
            {
              echo "Framings backtest finished: $summary."
              echo
              echo "Each yes/no forecast took a different approach (outside view, inside view, devil's advocate), on the same saved research as vb2. Positive means framings helped."
              echo
              grep -E "STOPPED|Done:" run.log || true
              echo
              uv run python backtest/score_model_swap.py --base vb2 --new vfr1 2>&1 || true
              echo
              echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              echo
              echo "cc @${{ github.repository_owner }}"
            } > notice.md
            gh issue create --title "Framings backtest finished" --body-file notice.md || echo "Could not open an issue"
          fi
          if [ -d "backtest/results/vfr1" ]; then git add "backtest/results/vfr1"; fi
          git commit -q -m "Framings backtest: $summary" || exit 0
          # The live runs push logs to main too, so rebase and retry.
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 10))
          done
          echo "Could not push the results"; exit 1

name: Backtest s1

# Seasonal history in the research (backtest/run_numeric_backtest.py, run s1) on the Max plan,
# which the live bot shares. 46 seasonal questions (backtest/data/seasonal_questions.jsonl), each
# researched twice: as live (s1-base) and with the seasonal note (s1-seasonal), 3 forecasts on
# each. Runs in chunks of CHUNK questions, both arms, at least GAP_HOURS apart, so the live bot
# keeps room in the 5-hour limit. GitHub drops many cron firings, so it fires hourly and a firing
# only runs a chunk when one is due; a manual run always runs one. Results are committed to branch
# backtest-s1. When every question has been tried it scores the run and opens an issue (emails
# the owner). Delete this file afterwards.
on:
  workflow_dispatch:
    inputs:
      chunk:
        description: "Questions in this chunk (blank = the usual 16)"
        default: ""
  schedule:
    - cron: "23 * 4,5,6,7 11 *"

concurrency:
  group: backtest-s1
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  chunk:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      BRANCH: backtest-s1
      DATA: backtest/data/seasonal_questions.jsonl
      BASELINES: backtest/data/seasonal_baselines.json
      CHUNK: ${{ inputs.chunk || '16' }}
      GAP_HOURS: "2"
      STOP: "2026-11-08T00:00:00Z"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Is a chunk due?
        id: due
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          now=$(date -u +%s)
          if [ "$now" -ge "$(date -u -d "$STOP" +%s)" ]; then
            echo "After $STOP, nothing to do"; echo "due=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The branch keeps the code as it was when the run started, plus the results so far.
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            git checkout -q -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -q -b "$BRANCH"
          fi
          mkdir -p backtest/results/s1-base backtest/results/s1-seasonal
          base=$(find backtest/results/s1-base -maxdepth 1 -name '*.json' | wc -l)
          seasonal=$(find backtest/results/s1-seasonal -maxdepth 1 -name '*.json' | wc -l)
          saved=$(( base < seasonal ? base : seasonal ))
          total=$(grep -c "" "$DATA")
          last=$(cat backtest/results/s1-base/.last_chunk 2>/dev/null || echo 0)
          echo "Saved $base as live and $seasonal with the note, of $total; last chunk started $(date -u -d "@$last")"
          if [ -f backtest/results/s1-base/.finished ]; then
            echo "Run finished"; echo "due=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ $(( now - last )) -lt $(( GAP_HOURS * 3600 )) ]; then
            echo "Last chunk less than $GAP_HOURS hours ago"; echo "due=false" >> "$GITHUB_OUTPUT"
          else
            { echo "due=true"; echo "limit=$(( saved + CHUNK ))"; echo "total=$total"; } >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.due.outputs.due == 'true'
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        if: steps.due.outputs.due == 'true'
        with:
          version: "0.13.1"
          enable-cache: true
      - name: Install
        if: steps.due.outputs.due == 'true'
        run: bash .github/scripts/retry.sh uv sync --locked && bash .github/scripts/install_claude.sh
      - name: Run a chunk
        if: steps.due.outputs.due == 'true'
        run: |
          date -u +%s > backtest/results/s1-base/.last_chunk
          git add backtest/results/s1-base/.last_chunk
          git commit -q -m "Backtest s1: chunk started"
          git push -q origin "$BRANCH"
          # Once, so both arms see the same as-of statistical baseline.
          if [ ! -f "$BASELINES" ]; then
            uv run python backtest/run_numeric_backtest.py --data "$DATA" --save-baselines "$BASELINES" 2>&1 | tail -50
            git add "$BASELINES" && git commit -q -m "Backtest s1: as-of baselines" && git push -q origin "$BRANCH"
          fi
          common="--data $DATA --baselines $BASELINES --variants thirteen --predictions 3 --parallel 2 --limit ${{ steps.due.outputs.limit }}"
          uv run python backtest/run_numeric_backtest.py --run s1-base $common 2>&1 | tee -a chunk.log || true
          uv run python backtest/run_numeric_backtest.py --run s1-seasonal --research-note seasonal $common 2>&1 | tee -a chunk.log || true
      - name: Save results, and score when every question has been tried
        if: always() && steps.due.outputs.due == 'true'
        run: |
          base=$(find backtest/results/s1-base -maxdepth 1 -name '*.json' | wc -l)
          seasonal=$(find backtest/results/s1-seasonal -maxdepth 1 -name '*.json' | wc -l)
          if [ "${{ steps.due.outputs.limit }}" -ge "${{ steps.due.outputs.total }}" ]; then
            uv run python backtest/score_numeric_two_reports.py --a s1-base --b s1-seasonal > score.md 2>&1 || true
            touch backtest/results/s1-base/.finished
            {
              echo "Seasonal research backtest s1 finished: $base questions researched as live and $seasonal with the seasonal note, of ${{ steps.due.outputs.total }}, on branch $BRANCH."
              echo
              echo "A is the research as live, B is the research with the seasonal note. The test is the row \"3 from B\" against \"3 from A\"."
              echo
              cat score.md
              echo
              echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              echo
              echo "cc @${{ github.repository_owner }}"
            } > notice.md
            gh issue create --title "Backtest s1 finished" --body-file notice.md || echo "Could not open an issue"
          fi
          git add backtest/results/s1-base backtest/results/s1-seasonal backtest/RESULTS.md
          git commit -q -m "Backtest s1: $base as live, $seasonal with the note" || true
          git push -q origin "$BRANCH"

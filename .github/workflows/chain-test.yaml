name: Chain test

# Throwaway: the real chain code (watchdog.py --keep-queued) on runs that do nothing, in their own
# queue, so the hand-off can be tested without touching the live forecast runs. By run number:
# 1 ends normally, 2 crashes, 3 hits the job's time limit, 4 ends normally. The quick-run guard
# should then stop the chain, as these all last under 10 minutes.
on:
  workflow_dispatch:

concurrency:
  group: chain-test
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
      WATCHDOG_WORKFLOW: chain-test.yaml
    steps:
      - uses: actions/checkout@v4
      - name: Keep a run queued behind this one
        run: python3 watchdog.py --keep-queued
      - name: Behave according to the run number
        run: |
          case "$GITHUB_RUN_NUMBER" in
            1) sleep 45 ;;
            2) sleep 45; echo "Crashing on purpose"; exit 1 ;;
            3) echo "Hanging on purpose"; sleep 600 ;;
            6) sleep 20; echo "Crashing on purpose"; exit 1 ;;
            7) ( while true; do sleep 5; done ) > /dev/null 2>&1 &
               sleep 20; echo "Ending with a background loop still running" ;;
            *) sleep 45 ;;
          esac
      - name: Runs even after a crash or a time limit
        if: always()
        run: echo "always step ran"

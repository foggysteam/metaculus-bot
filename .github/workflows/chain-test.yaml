name: Chain test

# Throwaway: checks that a run can start another with its own token, as forecast.yaml now does.
on:
  workflow_dispatch:
    inputs:
      depth:
        default: "0"

permissions:
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      DEPTH: ${{ inputs.depth }}
    steps:
      - name: Start one more run
        if: always() && env.DEPTH == '0'
        run: gh workflow run chain-test.yaml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f depth=1
      - name: Report
        run: echo "depth $DEPTH"

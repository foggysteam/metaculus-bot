name: Weekly report

# Mondays 08:00 UTC (08:00 UK in winter, 09:00 in summer). Posts the report as a
# GitHub issue, which emails the repo owner.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GO_LIVE_DATE: ${{ vars.GO_LIVE_DATE }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
      - run: uv sync --locked
      - run: npm install -g @anthropic-ai/claude-code
      - name: Build report
        run: uv run python weekly_report.py > report.md
      - name: Post report as an issue
        run: |
          gh label create weekly-report --color 0E8A16 --force
          gh issue create --title "Weekly report $(date -u +%Y-%m-%d)" --body-file report.md --label weekly-report

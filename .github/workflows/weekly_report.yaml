name: Weekly report

# Mondays 08:00 UTC. Posts the report as an issue in the owner's private repo (alerts.py),
# which emails the owner. It reads the forecast logs from that repo too.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GO_LIVE_DATE: ${{ vars.GO_LIVE_DATE }}
      GH_TOKEN: ${{ github.token }}
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out the private logs repo
        uses: actions/checkout@v4
        with:
          repository: foggysteam/metaculus-bot-private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
      - run: uv sync --locked
      - run: bash .github/scripts/install_claude.sh
      - name: Build report
        run: uv run python weekly_report.py > report.md
      - name: Post the report in the private repo
        run: python3 alerts.py send --title "Weekly report $(date -u +%Y-%m-%d)" --body-file report.md --label weekly-report

name: Backtest Fable 5.2

# Does Fable 5.2 write better forecasts than Opus 5.5 (live) on the same research? Forecasts
# only, on research saved by earlier runs, so only the forecasting model changes:
#   vf1 = yes/no, 3 forecasts reading both reports (v1 + v1-r2), against vb1 (Opus, same setup)
#   nf2, nf3 = numeric, 3 forecasts on report A (n2) and on report B (n3), against n2 + n3
# First a memory probe asks each model, with no research, whether it remembers how each
# question resolved: Fable 5.2 cannot say when its training data ends, and these questions
# resolved from August to October 2026. Runs on the Max plan (the live bot's token), so it stops
# starting questions once the three runs have used BUDGET_USD of notional usage. Results are
# committed to main; a re-run skips saved questions. When everything is done it scores the runs
# and opens an issue. Delete this file afterwards.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Questions per run (blank = all; 1 for a smoke test)"
        default: ""

concurrency:
  group: backtest-fable
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      MODEL: claude-fable-5-2
      BUDGET_USD: "80"
      LIMIT: ${{ inputs.limit || '1000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
      - name: Install
        run: bash .github/scripts/retry.sh uv sync --locked && bash .github/scripts/install_claude.sh
      - name: Run
        id: run
        run: |
          budget="--budget-usd $BUDGET_USD --budget-runs vf1,nf2,nf3 --limit $LIMIT --forecast-model $MODEL"
          uv run python backtest/probe_memory.py --model claude-opus-5-5 --run probe-opus55 --limit $LIMIT 2>&1 | tee -a run.log || true
          uv run python backtest/probe_memory.py --model $MODEL --run probe-fable52 --limit $LIMIT 2>&1 | tee -a run.log || true
          uv run python backtest/run_backtest.py --run vf1 --reuse-research v1 --reuse-research-b v1-r2 \
            --predictions 3 --market-predictions 0 --parallel 2 $budget 2>&1 | tee -a run.log || true
          for half in "nf2 n2" "nf3 n3"; do
            set -- $half
            uv run python backtest/run_numeric_backtest.py --run "$1" --reuse-research "$2" \
              --baselines backtest/data/numeric_baselines.json --variants thirteen --predictions 3 --parallel 2 $budget 2>&1 | tee -a run.log || true
          done
      - name: Save results, and score when the runs are done
        if: always()
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          count() { find "backtest/results/$1" -maxdepth 1 -name '*.json' 2>/dev/null | wc -l; }
          spent=$(uv run python -c "import sys; sys.path.insert(0, 'backtest'); from budget import saved_cost; print(f'{saved_cost([\"vf1\", \"nf2\", \"nf3\"]):.2f}')" 2>/dev/null || echo "?")
          summary="vf1 $(count vf1) of 75, nf2 $(count nf2) and nf3 $(count nf3) of 59, notional \$$spent of \$$BUDGET_USD"
          echo "$summary"
          # Only a full run that ended by itself is scored (a cancelled run opened a false notice, #13).
          if [ "$LIMIT" -ge 1000 ] && [ "${{ steps.run.outcome }}" = "success" ]; then
            uv run python backtest/score_model_swap.py --base vb1 --new vf1 --num-base n2,n3 --num-new nf2,nf3 \
              --probe probe-opus55,probe-fable52 > score.md 2>&1 || true
            {
              echo "Fable 5.2 backtest finished: $summary."
              echo
              echo "Same saved research, only the forecasting model changed (Opus 5.5 live, Fable 5.2 new). Positive means Fable 5.2 did better."
              echo
              grep -E "claimed to remember|STOPPED|Done:" run.log || true
              echo
              cat score.md
              echo
              echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              echo
              echo "cc @${{ github.repository_owner }}"
            } > notice.md
            gh issue create --title "Backtest Fable 5.2 finished" --body-file notice.md || echo "Could not open an issue"
          fi
          for d in vf1 nf2 nf3 probe-opus55 probe-fable52; do
            if [ -d "backtest/results/$d" ]; then git add "backtest/results/$d"; fi
          done
          git commit -q -m "Backtest Fable 5.2: $summary" || exit 0
          # The live runs push logs to main too, so rebase and retry.
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 10))
          done
          echo "Could not push the results"; exit 1

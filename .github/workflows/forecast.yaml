name: Forecast

# Questions open for only 3 hours at random times, and GitHub drops many cron
# firings. So each run can keep polling for LOOP_MINUTES (repo variable), runs
# queue behind each other via the concurrency group, and each run queues the next
# when it ends. Cron only restarts the chain if it breaks. To stop the chain,
# disable this workflow.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "tournament, test_questions, or question"
        default: "tournament"
      url:
        description: "Question URL (only for mode=question)"
        default: ""
      dry_run:
        description: "true = do not submit forecasts"
        default: "false"
  # Live since 24 Oct 2026. Each run polls for LOOP_MINUTES; queued runs keep coverage
  # going even when GitHub drops cron firings.
  schedule:
    - cron: "7,37 * * * *"

concurrency:
  group: forecast
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      LOOP_MINUTES: ${{ vars.LOOP_MINUTES || '0' }}
      POLL_SECONDS: ${{ vars.POLL_SECONDS || '600' }}
      MODE: ${{ inputs.mode || 'tournament' }}
      URL: ${{ inputs.url || '' }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
    steps:
      - name: Note the start time
        run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Check out repository
        uses: actions/checkout@v4
      # The checkout is of the commit when this run was queued, which can be hours old.
      - name: Get the latest code and logs
        run: git pull -q --ff-only || echo "Could not update the checkout"
      # A gap this long can lose questions. Nothing else watches for it: the health check is
      # daily, sees only questions already missed, and depends on the same cron.
      - name: Alert if nothing has been polling
        if: env.MODE == 'tournament' && env.DRY_RUN != 'true'
        continue-on-error: true
        run: |
          last=$(gh run list --workflow forecast.yaml --status completed --limit 10 --json updatedAt,conclusion --jq '[.[] | select(.conclusion != "cancelled")][0].updatedAt')
          gap=$(( ($(date +%s) - $(date -d "$last" +%s)) / 60 ))
          echo "Minutes since the last run ended: $gap"
          if [ "$gap" -ge 60 ]; then
            {
              echo "No forecast run was polling for $gap minutes, until $(date -u +%H:%M) UTC. Questions open for about 3 hours, so a gap this long can miss some. Polling has now restarted."
              echo
              echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              echo
              echo "cc @${{ github.repository_owner }}"
            } > gap.md
            gh issue create --title "Forecast polling gap $(date -u +%Y-%m-%d)" --body-file gap.md
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code && claude --version
      - name: Run bot (and keep polling for LOOP_MINUTES)
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          args="--mode $MODE"
          if [ -n "$URL" ]; then args="$args --url $URL"; fi
          if [ "$DRY_RUN" = "true" ]; then args="$args --dry-run"; fi
          end=$(( $(date +%s) + LOOP_MINUTES * 60 ))
          failures=0
          set -o pipefail
          while true; do
            if ! uv run python run_bot.py $args 2>&1 | tee pass.log; then
              failures=$(( failures + 1 ))
              echo "Bot pass failed, will retry next pass"
              # Questions are open for about 3 hours, so say so at once rather than in the
              # next morning's health check (question 46279 failed 13 passes in a row).
              if [ "$failures" -eq 2 ] && [ "$DRY_RUN" != "true" ]; then
                {
                  echo "The forecast run has had 2 failed passes. A question that keeps failing is missed when it closes, about 3 hours after it opens."
                  echo
                  echo '```'
                  grep -E "Error while processing question url" pass.log | tail -3 | cut -c1-700
                  echo '```'
                  echo
                  echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  echo
                  echo "cc @${{ github.repository_owner }}"
                } > alert.md
                gh issue create --title "Forecast run failing $(date -u +%Y-%m-%d)" --body-file alert.md || echo "Could not open an alert issue"
              fi
            fi
            if [ -n "$(git status --porcelain forecast_logs)" ]; then
              git add forecast_logs
              git commit -q -m "Forecast logs $(date -u +%Y-%m-%dT%H:%MZ)"
            fi
            # Every pass, so a failed push is retried even with nothing new. A failed rebase must
            # be undone, or every later push fails too and the logs go with the runner (2 Nov).
            if [ -n "$(git log -1 --format=%h '@{u}..')" ]; then
              if ! { git pull -q --rebase && git push -q; }; then
                git rebase --abort 2>/dev/null || true
                echo "Log push failed, will retry next pass"
              fi
            fi
            if [ "$MODE" != "tournament" ] || [ $(( $(date +%s) + POLL_SECONDS )) -ge $end ]; then
              break
            fi
            sleep "$POLL_SECONDS"
          done
          # Mark the run red if any pass failed, so problems are visible.
          if [ "$failures" -gt 0 ]; then
            echo "$failures bot pass(es) failed"
            exit 1
          fi
      # On 2 Nov cron fired nothing for 10 hours, nothing polled for 4h46m, and 5 MiniBench
      # questions opened and closed unseen. A run that ends within 30 minutes has a broken
      # setup, so it leaves the restart to cron instead of looping.
      - name: Queue the next run
        if: always() && env.MODE == 'tournament' && env.DRY_RUN != 'true'
        run: |
          if [ $(( $(date +%s) - STARTED )) -lt 1800 ]; then
            echo "Run ended too soon to queue another"
            exit 0
          fi
          gh workflow run forecast.yaml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"

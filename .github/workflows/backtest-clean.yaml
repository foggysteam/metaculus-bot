name: Backtest without the date hint

# Until 9 Nov 2026 every yes/no backtest told the models the real resolution date, and an early
# date gives away a Yes (Fable 5.2 used it openly, issue #16). This re-runs the live forecaster,
# Opus 5.5 with no fallback, on the research of v1 + v1-r2 with the date hidden and research lines
# that repeat it dropped, 3 forecasts each reading both reports (the live setup): run vb2 against
# vb1 (same forecasts with the hint). It shows how much the hint flattered earlier backtests and
# re-checks the x0.8 shrink. Numeric questions never carried the hint. No Fable on the Max plan
# (Ahmad, 9 Nov 2026). Runs on the Max plan and stops starting questions once vb2 has used
# BUDGET_USD of notional usage. Results are committed to main; a re-run skips saved questions.
# Delete this file afterwards.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Questions per run (blank = all; 1 for a smoke test)"
        default: ""

concurrency:
  group: backtest-clean
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      BUDGET_USD: "20"
      LIMIT: ${{ inputs.limit || '1000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
      - name: Install
        run: bash .github/scripts/retry.sh uv sync --locked && bash .github/scripts/install_claude.sh
      - name: Run
        id: run
        run: |
          uv run python backtest/run_backtest.py --run vb2 --forecast-model claude-opus-5-5 --reuse-research v1 --reuse-research-b v1-r2 \
            --predictions 3 --market-predictions 0 --parallel 2 --budget-usd $BUDGET_USD --limit $LIMIT 2>&1 | tee -a run.log || true
      - name: Save results, and score when the runs are done
        if: always()
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          count() { find "backtest/results/$1" -maxdepth 1 -name '*.json' 2>/dev/null | wc -l; }
          spent=$(uv run python -c "import sys; sys.path.insert(0, 'backtest'); from budget import saved_cost; print(f'{saved_cost([\"vb2\"]):.2f}')" 2>/dev/null || echo "?")
          summary="vb2 $(count vb2) of 76, notional \$$spent of \$$BUDGET_USD"
          echo "$summary"
          # Only a full run that ended by itself is scored (a cancelled run opened a false notice, #13).
          if [ "$LIMIT" -ge 1000 ] && [ "${{ steps.run.outcome }}" = "success" ]; then
            {
              echo "Re-run without the date hint finished: $summary."
              echo
              echo "Opus 5.5 on the same saved research, the real resolution date hidden. Negative means the hint was flattering the earlier backtests."
              echo
              grep -E "STOPPED|Done:" run.log || true
              echo
              uv run python backtest/score_model_swap.py --base vb1 --new vb2 2>&1 || true
              echo
              echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              echo
              echo "cc @${{ github.repository_owner }}"
            } > notice.md
            gh issue create --title "Backtest without the date hint finished" --body-file notice.md || echo "Could not open an issue"
          fi
          for d in vb2; do
            if [ -d "backtest/results/$d" ]; then git add "backtest/results/$d"; fi
          done
          git commit -q -m "Backtest without the date hint: $summary" || exit 0
          # The live runs push logs to main too, so rebase and retry.
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 10))
          done
          echo "Could not push the results"; exit 1
